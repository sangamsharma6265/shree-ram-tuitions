<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shree Ram Home Tuitions - Find Best Tutors</title>
    <!-- Tailwind CSS CDN for modern and fast styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">

    <!-- Navbar -->
    <nav class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold text-indigo-600">📚 Shree Ram Tuitions</h1>
            <div class="space-x-4">
                <a href="#find-tutor" class="text-slate-600 hover:text-indigo-600 font-medium">Find Tutor</a>
                <a href="#register" class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 font-medium">Register as Tutor</a>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <header class="bg-indigo-900 text-white py-20 text-center px-4">
        <div class="max-w-3xl mx-auto">
            <h2 class="text-4xl font-extrabold mb-4">Find the Best Home Tutors Near You</h2>
            <p class="text-indigo-200 text-lg mb-8">Connect with verified and experienced tutors for school subjects, board exams, and competitive coaching.</p>
            <a href="#register" class="bg-emerald-500 text-white px-8 py-3 rounded-lg font-bold text-lg hover:bg-emerald-600 shadow-lg">Join as a Tutor Today</a>
        </div>
    </header>

    <!-- Tutor Registration Form Section -->
    <section id="register" class="max-w-xl mx-auto my-16 bg-white p-8 rounded-2xl shadow-md border border-slate-100">
        <h3 class="text-2xl font-bold text-center text-indigo-900 mb-6">Tutor Registration Form</h3>
        
        <form action="/register-tutor" method="POST" class="space-y-4">
            <div>
                <label class="block text-sm font-semibold text-slate-600 mb-1">Full Name</label>
                <input type="text" name="name" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Enter your full name">
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-600 mb-1">Email Address</label>
                <input type="email" name="email" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Enter your email">
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-600 mb-1">Phone Number</label>
                <input type="tel" name="phone" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Enter your mobile number">
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-600 mb-1">Subjects You Teach</label>
                <input type="text" name="subjects" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="e.g. Math, Science, English">
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-600 mb-1">Experience (in Years)</label>
                <input type="number" name="experience" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="e.g. 3">
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-600 mb-1">Area / Location</label>
                <input type="text" name="location" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="e.g. Dwarka, Delhi">
            </div>

            <button type="submit" class="w-full bg-indigo-600 text-white py-3 rounded-lg font-bold hover:bg-indigo-700 transition duration-200">Submit Registration</button>
        </form>
    </section>

    <!-- Footer -->
    <footer class="bg-slate-800 text-slate-400 text-center py-6">
        <p>&copy; 2026 Shree Ram Home Tuitions. All rights reserved.</p>
    </footer>

</body>
</html>
