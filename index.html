<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shree Ram Tuitions - Find Expert Home Tutors</title>
    <!-- Force fresh build update -->
    <meta name="google-site-verification" content="5gyA49hp12_UtKA8jCSg4DHiITPVT_NDJTV-qhgz8oc" />
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f8fafc;
            margin: 0;
            padding: 20px;
            color: #334155;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
        h1 {
            color: #1e293b;
            text-align: center;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            background: #4f46e5;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        button:hover {
            background: #4338ca;
        }
        .admin-link {
            text-align: center;
            margin-top: 20px;
        }
        .admin-link a {
            color: #0284c7;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Shree Ram Tuitions 📚</h1>
        <p style="text-align: center; color: #64748b; margin-top: -15px; margin-bottom: 25px;">Register as a Tutor to connect with students</p>
        
        <form action="/register-tutor" method="POST">
            <div class="form-group">
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" required placeholder="Enter your full name">
            </div>

            <div class="form-group">
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required placeholder="Enter your email">
            </div>

            <div class="form-group">
                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone" required placeholder="Enter your mobile number">
            </div>

            <div class="form-group">
                <label for="subjects">Subjects You Can Teach:</label>
                <input type="text" id="subjects" name="subjects" required placeholder="e.g. Math, Physics, English">
            </div>

            <div class="form-group">
                <label for="experience">Experience (in Years):</label>
                <input type="number" id="experience" name="experience" required placeholder="e.g. 3">
            </div>

            <div class="form-group">
                <label for="location">Preferred Location / Area:</label>
                <input type="text" id="location" name="location" required placeholder="Enter your area/locality">
            </div>

            <button type="submit">Register Now</button>
        </form>

        <div class="admin-link">
            <a href="/admin">Go to Admin Dashboard</a>
        </div>
    </div>

</body>
</html>
